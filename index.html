<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUBWAY Promotion Tracker</title>

  <style>
    :root {
      --subway-green: #00843d;
      --subway-dark: #006b32;
      --subway-yellow: #ffc600;
      --subway-light: #eaf7ef;
      --background: #f3f6f4;
      --text: #202522;
      --muted: #7a827d;
      --border: #e6ebe8;
      --danger: #d93025;
      --danger-light: #fdeceb;
      --white: #ffffff;
      --shadow: 0 5px 20px rgba(0, 70, 35, .07);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: linear-gradient(180deg, #f0f5f2 0%, #f7f8f7 45%, #f3f5f4 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    button, input { font-family: inherit; }
    button { -webkit-tap-highlight-color: transparent; cursor: pointer; }

    /* =====================================================
       APP — desktop-first layout
    ===================================================== */

    .app {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 32px 50px;
    }

    .layout {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 20px;
      align-items: start;
    }

    .sidebar {
      position: sticky;
      top: 28px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .main {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* =====================================================
       HEADER
    ===================================================== */

    .header {
      position: relative;
      overflow: hidden;
      padding: 26px 24px 24px;
      border-radius: 18px;
      color: white;
      background: linear-gradient(135deg, #00843d 0%, #007238 55%, #005e2e 100%);
      box-shadow: 0 8px 25px rgba(0, 110, 55, .18);
    }

    .header::before {
      content: "";
      position: absolute;
      width: 150px;
      height: 150px;
      right: -55px;
      top: -65px;
      border-radius: 50%;
      background: rgba(255,255,255,.06);
    }

    .header::after {
      content: "";
      position: absolute;
      width: 90px;
      height: 90px;
      right: 45px;
      bottom: -55px;
      border-radius: 50%;
      background: rgba(255,198,0,.08);
    }

    .header-content { position: relative; z-index: 2; }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: rgba(255,255,255,.14);
      border: 1px solid rgba(255,255,255,.18);
      font-size: 22px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
    }

    .brand-title { min-width: 0; }

    .brand-title h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: -.4px;
    }

    .brand-title p {
      margin: 4px 0 0;
      color: rgba(255,255,255,.78);
      font-size: 12px;
    }

    /* editable branch badge */
    .branch-row {
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .branch-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      color: #3d3100;
      background: var(--subway-yellow);
      font-size: 12px;
      font-weight: 800;
      box-shadow: 0 3px 8px rgba(0,0,0,.12);
    }

    .branch-badge input {
      border: none;
      background: transparent;
      outline: none;
      color: #3d3100;
      font-weight: 800;
      font-size: 12px;
      width: 110px;
      min-width: 40px;
    }

    /* =====================================================
       DATE CARD
    ===================================================== */

    .date-card {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 18px 20px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 15px;
      box-shadow: var(--shadow);
    }

    .date-info { display: flex; align-items: center; gap: 11px; }

    .date-icon {
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      color: var(--subway-green);
      background: var(--subway-light);
      font-size: 18px;
      flex: 0 0 38px;
    }

    .date-label { color: var(--muted); font-size: 11px; margin-bottom: 2px; }
    .date-value { font-size: 13px; font-weight: 700; }

    .date-input {
      width: 100%;
      height: 38px;
      padding: 0 9px;
      border: 1px solid #dfe5e1;
      border-radius: 9px;
      background: #fafbfa;
      color: var(--text);
      outline: none;
      font-size: 13px;
    }

    .date-input:focus {
      border-color: var(--subway-green);
      box-shadow: 0 0 0 3px rgba(0,132,61,.08);
    }

    /* =====================================================
       DASHBOARD
    ===================================================== */

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .summary-card {
      position: relative;
      overflow: hidden;
      padding: 18px;
      min-height: 105px;
      border-radius: 15px;
      background: var(--white);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .summary-card::after {
      content: "";
      position: absolute;
      width: 55px;
      height: 55px;
      right: -20px;
      bottom: -20px;
      border-radius: 50%;
      background: var(--subway-light);
    }

    .summary-icon { font-size: 17px; margin-bottom: 8px; }
    .summary-label { position: relative; z-index: 2; color: var(--muted); font-size: 11px; font-weight: 600; }
    .summary-value {
      position: relative;
      z-index: 2;
      margin-top: 2px;
      color: var(--subway-green);
      font-size: 28px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -.5px;
    }

    /* =====================================================
       CARD
    ===================================================== */

    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 22px;
      box-shadow: var(--shadow);
      animation: cardIn .35s ease both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .card-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      font-size: 18px;
      font-weight: 800;
    }

    .section-icon {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: var(--subway-light);
      font-size: 15px;
    }

    .card-description { margin: 0 0 14px; color: var(--muted); font-size: 12px; }

    .btn-add-promo {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 15px;
      border: none;
      border-radius: 10px;
      background: var(--subway-green);
      color: white;
      font-weight: 700;
      font-size: 12.5px;
      box-shadow: 0 4px 10px rgba(0,132,61,.2);
      transition: background .15s ease, transform .12s ease;
    }

    .btn-add-promo:hover { background: var(--subway-dark); }
    .btn-add-promo:active { transform: scale(.96); }

    /* =====================================================
       PROMOTIONS
    ===================================================== */

    .promo-list { border-top: 1px solid #edf0ee; }

    .promo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 73px;
      padding: 12px 0;
      border-bottom: 1px solid #edf0ee;
      transition: background .2s ease;
    }

    .promo-item:last-child { border-bottom: none; }

    .promo-item.confirming-delete {
      background: var(--danger-light);
      border-radius: 10px;
      padding-left: 10px;
      padding-right: 10px;
    }

    .promo-info { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 5px; }

    .promo-name-input,
    .promo-detail-input {
      border: 1px solid transparent;
      background: transparent;
      border-radius: 7px;
      padding: 4px 7px;
      outline: none;
      color: #202522;
      font-family: inherit;
      width: 100%;
      transition: background .12s ease, border-color .12s ease;
    }

    .promo-name-input {
      font-size: 14px;
      font-weight: 750;
    }

    .promo-detail-input {
      font-size: 11.5px;
      color: var(--muted);
    }

    .promo-name-input:hover,
    .promo-detail-input:hover {
      background: #f7f9f8;
    }

    .promo-name-input:focus,
    .promo-detail-input:focus {
      background: #fafffc;
      border-color: var(--subway-green);
    }

    .promo-actions {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 0 0 auto;
    }

    /* =====================================================
       COUNTER
    ===================================================== */

    .counter { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }

    .counter button {
      width: 35px;
      height: 35px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 10px;
      font-size: 20px;
      font-weight: 600;
      transition: transform .12s ease, background .12s ease;
    }

    .counter button:active { transform: scale(.88); }

    .btn-minus { color: #59605c; background: #f0f2f1; }
    .btn-minus:hover { background: #e5e9e7; }

    .btn-plus { color: #4a3b00; background: var(--subway-yellow); }
    .btn-plus:hover { background: #f7bb00; }

    .counter-value { width: 30px; text-align: center; color: var(--text); font-size: 16px; font-weight: 800; }

    .count-bump { animation: bump .4s ease; }

    @keyframes bump {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .btn-delete {
      width: 35px;
      height: 35px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 10px;
      background: var(--danger-light);
      color: var(--danger);
      font-size: 15px;
      transition: background .15s ease, transform .12s ease;
    }

    .btn-delete:hover { background: #f9d9d6; }
    .btn-delete:active { transform: scale(.9); }

    /* inline delete-confirm bar (replaces the row's action buttons) */
    .confirm-delete-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
      white-space: nowrap;
    }

    .confirm-delete-bar span {
      font-size: 12px;
      font-weight: 700;
      color: var(--danger);
    }

    .btn-confirm-yes {
      padding: 7px 12px;
      border: none;
      border-radius: 8px;
      background: var(--danger);
      color: white;
      font-size: 12px;
      font-weight: 700;
    }

    .btn-confirm-yes:hover { background: #b8261d; }

    .btn-confirm-no {
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: white;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .btn-confirm-no:hover { background: #f3f5f4; }

    .empty-state {
      padding: 30px 10px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    /* =====================================================
       ADD PROMO FORM (inline)
    ===================================================== */

    .add-promo-form {
      display: none;
      grid-template-columns: 1fr 1fr auto auto;
      gap: 10px;
      align-items: center;
      padding: 14px;
      margin-bottom: 12px;
      border-radius: 12px;
      background: var(--subway-light);
      border: 1px dashed #b7ddc4;
    }

    .add-promo-form.open { display: grid; }

    .add-promo-form input {
      padding: 9px 11px;
      border: 1px solid #cfe7d9;
      border-radius: 9px;
      font-size: 13px;
      outline: none;
      background: white;
    }

    .add-promo-form input:focus {
      border-color: var(--subway-green);
      box-shadow: 0 0 0 3px rgba(0,132,61,.08);
    }

    .btn-confirm-add {
      padding: 9px 14px;
      border: none;
      border-radius: 9px;
      background: var(--subway-green);
      color: white;
      font-weight: 700;
      font-size: 12.5px;
      white-space: nowrap;
    }

    .btn-confirm-add:hover { background: var(--subway-dark); }

    .btn-cancel-add {
      padding: 9px 14px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: white;
      color: var(--muted);
      font-weight: 700;
      font-size: 12.5px;
      white-space: nowrap;
    }

    .btn-cancel-add:hover { background: #f3f5f4; }

    /* =====================================================
       FOOTER / small reset button
    ===================================================== */

    .footer-bar {
      display: flex;
      justify-content: center;
      margin-top: 8px;
    }

    .btn-reset-small {
      padding: 7px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font-size: 11.5px;
      font-weight: 600;
      transition: background .15s ease, color .15s ease, border-color .15s ease;
    }

    .btn-reset-small:hover {
      background: var(--danger-light);
      color: var(--danger);
      border-color: #f3c9c5;
    }

    .reset-confirm-bar {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--danger-light);
      border: 1px solid #f3c9c5;
    }

    .reset-confirm-bar.open { display: flex; }

    .reset-confirm-bar span {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--danger);
    }

    .reset-confirm-bar button {
      padding: 6px 12px;
      border: none;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 700;
    }

    .reset-confirm-bar .btn-confirm-yes { background: var(--danger); color: white; }
    .reset-confirm-bar .btn-confirm-yes:hover { background: #b8261d; }
    .reset-confirm-bar .btn-confirm-no { background: white; color: var(--muted); border: 1px solid var(--border); }

    .toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      padding: 11px 20px;
      border-radius: 999px;
      background: #202522;
      color: white;
      font-size: 12.5px;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(0,0,0,.22);
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease, transform .25s ease;
      z-index: 50;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* =====================================================
       RESPONSIVE — collapse to single column on narrow screens
    ===================================================== */

    @media (max-width: 880px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { position: static; }
      .app { padding: 16px 14px 30px; }
      .summary { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 560px) {
      .summary { grid-template-columns: repeat(2, 1fr); }
      .add-promo-form { grid-template-columns: 1fr; }
      .promo-item { flex-wrap: wrap; }
    }
  
    .addon-panel { margin-top:14px; padding:14px; background:#fffaf0; border:1px dashed #f0cf66; border-radius:12px; }
    .addon-title { font-size:13px; font-weight:800; margin-bottom:10px; }
    .addon-list { display:flex; flex-direction:column; gap:8px; }
    .addon-row { display:grid; grid-template-columns:1fr 90px 35px; gap:8px; align-items:center; }
    .addon-row input { width:100%; padding:8px 9px; border:1px solid #e5dfc8; border-radius:8px; font-size:12px; outline:none; }
    .addon-row input:focus { border-color:var(--subway-green); }
    .addon-total { margin-top:10px; padding:10px 12px; border-radius:9px; background:var(--subway-light); display:flex; justify-content:space-between; font-weight:800; color:var(--subway-green); }
    .btn-addon { padding:8px 11px; border:0; border-radius:8px; background:var(--subway-yellow); font-weight:800; font-size:12px; }
    .btn-remove-addon { width:35px; height:35px; border:0; border-radius:8px; background:var(--danger-light); color:var(--danger); }
    @media(max-width:560px){ .addon-row { grid-template-columns:1fr 75px 35px; } }
</style>
</head>
<body>
  <div class="app">
    <div class="layout">

      <!-- SIDEBAR -->
      <div class="sidebar">
        <div class="header">
          <div class="header-content">
            <div class="brand-row">
              <div class="brand-icon">🥪</div>
              <div class="brand-title">
                <h1>SUBWAY Promotion</h1>
                <p>Promotion Tracker</p>
              </div>
            </div>
            <div class="branch-row">
              <div class="branch-badge">
                📍
                <input type="text" id="branchInput" value="ศาลายา" size="8">
              </div>
            </div>
          </div>
        </div>

        <div class="date-card">
          <div class="date-info">
            <div class="date-icon">📅</div>
            <div>
              <div class="date-label">วันที่ปัจจุบัน</div>
              <div class="date-value" id="currentDate">1 ม.ค. 2567</div>
            </div>
          </div>
          <input type="date" class="date-input" id="dateInput">
        </div>
      </div>

      <!-- MAIN -->
      <div class="main">
        <div class="summary">
          <div class="summary-card">
            <div class="summary-icon">🛍️</div>
            <div class="summary-label">โปรโมชั่นทั้งหมด</div>
            <div class="summary-value" id="totalPromo">0</div>
          </div>
          <div class="summary-card">
            <div class="summary-icon">✅</div>
            <div class="summary-label">ใช้ไปแล้ว</div>
            <div class="summary-value" id="usedPromo">0</div>
          </div>
          <div class="summary-card">
            <div class="summary-icon">🏆</div>
            <div class="summary-label">ยอดฮิตสุด</div>
            <div class="summary-value" id="topPromo" style="font-size:16px;">-</div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h2 class="card-title">
              <span class="section-icon">🎁</span>
              โปรโมชั่น
            </h2>
            <button type="button" class="btn-add-promo" id="showAddFormBtn">＋ เพิ่มโปรโมชั่น</button>
          </div>
          <p class="card-description">คลิกที่ชื่อหรือรายละเอียดเพื่อแก้ไขได้โดยตรง</p>

          <div class="addon-panel">
            <div class="addon-title">➕ Add On — รวมยอดอัตโนมัติ</div>
            <div class="addon-list" id="addonList"></div>
            <button type="button" class="btn-addon" id="addAddonBtn">＋ เพิ่ม Add On</button>
            <div class="addon-total"><span>ยอด Add On รวม</span><span id="addonTotal">0</span></div>
          </div>

          <div class="add-promo-form" id="addPromoForm">
            <input type="text" id="newPromoName" placeholder="ชื่อโปรโมชั่น เช่น ซื้อ 1 แถม 1">
            <input type="text" id="newPromoDetail" placeholder="รายละเอียด เช่น เมนูแซนด์วิช 6 นิ้ว">
            <button type="button" class="btn-confirm-add" id="confirmAddBtn">เพิ่ม</button>
            <button type="button" class="btn-cancel-add" id="cancelAddBtn">ยกเลิก</button>
          </div>

          <div class="promo-list" id="promoList">
            <!-- Promotions rendered here -->
          </div>
        </div>

        <!-- small reset control at the very bottom -->
        <div class="footer-bar">
          <button class="btn-reset-small" id="resetBtn">รีเซ็ตยอดการใช้ทั้งหมด</button>
          <div class="reset-confirm-bar" id="resetConfirmBar">
            <span>ยืนยันรีเซ็ตยอดการใช้ทั้งหมดกลับเป็น 0?</span>
            <button class="btn-confirm-yes" id="resetYesBtn">ยืนยัน</button>
            <button class="btn-confirm-no" id="resetNoBtn">ยกเลิก</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const STORAGE_KEY = 'subway_promo_tracker_v1';

    const DEFAULT_PROMOTIONS = [
      { id: 1, name: 'ซื้อ 2 แถม 1', detail: 'วุ้นมะนาว', count: 5 },
      { id: 2, name: 'ส่วนลด 20%', detail: 'เมนูซูป', count: 8 },
      { id: 3, name: 'ฟรีเครื่องดื่ม', detail: 'สำหรับชุดคู่', count: 3 },
      { id: 4, name: 'แถมคุกกี้ฟรี', detail: 'เมื่อซื้อเซตมีล', count: 12 },
      { id: 5, name: 'BOGO Combo', detail: 'ทุกช่วงบ่าย', count: 6 },
    ];

    const app = {
      data: {
        promotions: [],
        nextId: 1,
        pendingDeleteId: null,
        branch: 'ศาลายา'
      },

      init() {
        this.loadData();
        this.updateDate();
        this.renderPromotions();
        this.updateSummary();
        this.bindEvents();
      },

      // ============ PERSISTENCE (localStorage) ============

      loadData() {
        let saved = null;
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) saved = JSON.parse(raw);
        } catch (err) {
          console.error('อ่านข้อมูลที่บันทึกไว้ไม่สำเร็จ:', err);
        }

        if (saved && Array.isArray(saved.promotions)) {
          this.data.promotions = saved.promotions;
          this.data.nextId = saved.nextId || (Math.max(0, ...saved.promotions.map(p => p.id)) + 1);
          this.data.branch = saved.branch || 'ศาลายา';
        } else {
          // first time — seed with defaults
          this.data.promotions = DEFAULT_PROMOTIONS.map(p => ({ ...p }));
          this.data.nextId = 6;
          this.data.branch = 'ศาลายา';
        }

        document.getElementById('branchInput').value = this.data.branch;
      },

      saveData() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            promotions: this.data.promotions,
            nextId: this.data.nextId,
            branch: this.data.branch
          }));
        } catch (err) {
          console.error('บันทึกข้อมูลไม่สำเร็จ:', err);
          this.showToast('⚠️ บันทึกข้อมูลไม่สำเร็จ');
        }
      },

      bindEvents() {
        document.getElementById('dateInput').addEventListener('change', (e) => {
          this.handleDateChange(e.target.value);
        });

        document.getElementById('branchInput').addEventListener('change', (e) => {
          this.data.branch = e.target.value.trim() || 'ไม่ระบุสาขา';
          e.target.value = this.data.branch;
          this.saveData();
        });

        document.getElementById('showAddFormBtn').addEventListener('click', () => {
          const form = document.getElementById('addPromoForm');
          form.classList.add('open');
          document.getElementById('newPromoName').focus();
        });

        document.getElementById('cancelAddBtn').addEventListener('click', () => {
          this.closeAddForm();
        });

        document.getElementById('confirmAddBtn').addEventListener('click', () => {
          this.addPromotion();
        });

        document.getElementById('newPromoName').addEventListener('keydown', (e) => {
          if (e.key === 'Enter') this.addPromotion();
        });
        document.getElementById('newPromoDetail').addEventListener('keydown', (e) => {
          if (e.key === 'Enter') this.addPromotion();
        });

        // reset flow — inline confirm, no window.confirm()
        document.getElementById('resetBtn').addEventListener('click', () => {
          document.getElementById('resetBtn').style.display = 'none';
          document.getElementById('resetConfirmBar').classList.add('open');
        });

        document.getElementById('resetNoBtn').addEventListener('click', () => {
          this.closeResetConfirm();
        });

        document.getElementById('resetYesBtn').addEventListener('click', () => {
          this.data.promotions.forEach(p => p.count = 0);
          this.renderPromotions();
          this.updateSummary();
          this.saveData();
          this.closeResetConfirm();
          this.showToast('รีเซ็ตยอดการใช้ทั้งหมดเรียบร้อยแล้ว');
        });
      },

      closeResetConfirm() {
        document.getElementById('resetBtn').style.display = '';
        document.getElementById('resetConfirmBar').classList.remove('open');
      },

      closeAddForm() {
        document.getElementById('addPromoForm').classList.remove('open');
        document.getElementById('newPromoName').value = '';
        document.getElementById('newPromoDetail').value = '';
      },

      addPromotion() {
        const nameInput = document.getElementById('newPromoName');
        const detailInput = document.getElementById('newPromoDetail');
        const name = nameInput.value.trim();
        const detail = detailInput.value.trim();

        if (!name) {
          nameInput.focus();
          return;
        }

        this.data.promotions.push({
          id: this.data.nextId++,
          name: name,
          detail: detail || 'ไม่มีรายละเอียดเพิ่มเติม',
          count: 0
        });

        this.closeAddForm();
        this.renderPromotions();
        this.updateSummary();
        this.saveData();
        this.showToast('เพิ่มโปรโมชั่นเรียบร้อยแล้ว');
      },

      // step 1: show inline confirm row instead of window.confirm()
      askDeletePromotion(id) {
        this.data.pendingDeleteId = id;
        this.renderPromotions();
      },

      cancelDeletePromotion() {
        this.data.pendingDeleteId = null;
        this.renderPromotions();
      },

      // step 2: actually remove after user confirms in-page
      confirmDeletePromotion(id) {
        const promo = this.data.promotions.find(p => p.id === id);
        this.data.promotions = this.data.promotions.filter(p => p.id !== id);
        this.data.pendingDeleteId = null;
        this.renderPromotions();
        this.updateSummary();
        this.saveData();
        if (promo) this.showToast(`ลบโปรโมชั่น "${promo.name}" แล้ว`);
      },

      updateDate() {
        const now = new Date();
        const options = { day: 'numeric', month: 'long', year: 'numeric' };
        document.getElementById('currentDate').textContent = now.toLocaleDateString('th-TH', options);
        document.getElementById('dateInput').valueAsDate = now;
      },

      escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      },

      renderPromotions() {
        const promoList = document.getElementById('promoList');

        if (this.data.promotions.length === 0) {
          promoList.innerHTML = `<div class="empty-state">ยังไม่มีโปรโมชั่น กด "＋ เพิ่มโปรโมชั่น" เพื่อเริ่มต้น</div>`;
          return;
        }

        promoList.innerHTML = this.data.promotions.map(promo => {
          const isConfirming = this.data.pendingDeleteId === promo.id;

          const actionsHtml = isConfirming ? `
            <div class="confirm-delete-bar">
              <span>ลบรายการนี้?</span>
              <button class="btn-confirm-yes" onclick="app.confirmDeletePromotion(${promo.id})">ยืนยัน</button>
              <button class="btn-confirm-no" onclick="app.cancelDeletePromotion()">ยกเลิก</button>
            </div>
          ` : `
            <div class="counter">
              <button class="btn-minus" onclick="app.decreaseCount(${promo.id})">−</button>
              <div class="counter-value" id="count-${promo.id}">${promo.count}</div>
              <button class="btn-plus" onclick="app.increaseCount(${promo.id})">+</button>
            </div>
            <button class="btn-delete" onclick="app.askDeletePromotion(${promo.id})" title="ลบโปรโมชั่นนี้">🗑️</button>
          `;

          return `
            <div class="promo-item ${isConfirming ? 'confirming-delete' : ''}" data-id="${promo.id}">
              <div class="promo-info">
                <input
                  class="promo-name-input"
                  type="text"
                  value="${this.escapeHtml(promo.name)}"
                  data-id="${promo.id}"
                  data-field="name"
                >
                <input
                  class="promo-detail-input"
                  type="text"
                  value="${this.escapeHtml(promo.detail)}"
                  data-id="${promo.id}"
                  data-field="detail"
                >
              </div>
              <div class="promo-actions">
                ${actionsHtml}
              </div>
            </div>
          `;
        }).join('');

        // bind edit events for name/detail inputs
        promoList.querySelectorAll('.promo-name-input, .promo-detail-input').forEach(input => {
          input.addEventListener('change', (e) => {
            const id = parseInt(e.target.dataset.id, 10);
            const field = e.target.dataset.field;
            const promo = this.data.promotions.find(p => p.id === id);
            if (promo) {
              promo[field] = e.target.value.trim() || (field === 'name' ? 'โปรโมชั่นไม่มีชื่อ' : '');
              this.updateSummary();
              this.saveData();
            }
          });
        });
      },

      increaseCount(id) {
        const promo = this.data.promotions.find(p => p.id === id);
        if (promo) {
          promo.count++;
          this.updateCountDisplay(id);
          this.updateSummary();
          this.bumpAnimation(id);
          this.saveData();
        }
      },

      decreaseCount(id) {
        const promo = this.data.promotions.find(p => p.id === id);
        if (promo && promo.count > 0) {
          promo.count--;
          this.updateCountDisplay(id);
          this.updateSummary();
          this.bumpAnimation(id);
          this.saveData();
        }
      },

      updateCountDisplay(id) {
        const element = document.getElementById(`count-${id}`);
        if (element) {
          const promo = this.data.promotions.find(p => p.id === id);
          element.textContent = promo.count;
        }
      },

      bumpAnimation(id) {
        const element = document.getElementById(`count-${id}`);
        if (element) {
          element.classList.remove('count-bump');
          void element.offsetWidth;
          element.classList.add('count-bump');
          setTimeout(() => element.classList.remove('count-bump'), 400);
        }
      },

      updateSummary() {
        const total = this.data.promotions.length;
        const used = this.data.promotions.reduce((sum, p) => sum + p.count, 0);

        let top = '-';
        if (this.data.promotions.length > 0) {
          const topPromo = [...this.data.promotions].sort((a, b) => b.count - a.count)[0];
          if (topPromo.count > 0) top = topPromo.name;
        }

        document.getElementById('totalPromo').textContent = total;
        document.getElementById('usedPromo').textContent = used;
        document.getElementById('topPromo').textContent = top;
      },

      handleDateChange(dateString) {
        console.log('Selected date:', dateString);
      },

      showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(this._toastTimer);
        this._toastTimer = setTimeout(() => {
          toast.classList.remove('show');
        }, 2200);
      }
    };


    // ================= ADD ON =================
    const addonApp = {
      addons: [],
      init() {
        try { this.addons = JSON.parse(localStorage.getItem('subway_addons_v1') || '[]'); } catch(e) { this.addons=[]; }
        document.getElementById('addAddonBtn').addEventListener('click', () => this.add());
        this.render();
      },
      add() {
        this.addons.push({name:'Add On', amount:0});
        this.save(); this.render();
      },
      remove(i) { this.addons.splice(i,1); this.save(); this.render(); },
      update(i, field, value) {
        if(field==='amount') value=Math.max(0, Number(value)||0);
        this.addons[i][field]=value; this.save(); this.updateTotal();
      },
      save() { try { localStorage.setItem('subway_addons_v1', JSON.stringify(this.addons)); } catch(e) {} },
      total() { return this.addons.reduce((sum,a)=>sum+(Number(a.amount)||0),0); },
      updateTotal() { document.getElementById('addonTotal').textContent=this.total().toLocaleString('th-TH'); },
      render() {
        const list=document.getElementById('addonList');
        list.innerHTML=this.addons.map((a,i)=>`<div class="addon-row">
          <input type="text" value="${app.escapeHtml(a.name)}" placeholder="ชื่อ Add On" onchange="addonApp.update(${i},'name',this.value)">
          <input type="number" min="0" value="${Number(a.amount)||0}" placeholder="จำนวน" onchange="addonApp.update(${i},'amount',this.value)">
          <button class="btn-remove-addon" onclick="addonApp.remove(${i})">×</button>
        </div>`).join('');
        this.updateTotal();
      }
    };

    document.addEventListener('DOMContentLoaded', () => { app.init(); addonApp.init(); });
  </script>
</body>
</html>
